<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="../Assets/style.css" />
		<title>| Login - Join |</title>
	</head>

	<body>
		<section class="bodyLayout">
			<div class="loginMainLayout">
				<div class="loginTop">
					<div class="login">
						<label for="topLogin">Login</label>
						<input type="radio" name="loginTopSelect" id="topLogin" checked />
					</div>

					<div class="signup">
						<label for="topsignup">Sign Up</label>
						<input type="radio" name="loginTopSelect" id="topsignup" />
					</div>
				</div>

				<article class="userLoginInput">
					<div class="userLoginFormlayout">
						<form action="" class="loginPageForm loginForm">
							<label for="username">Username</label>
							<input type="text" id="username" required />
							<label for="password">Password</label>
							<input type="password" required />
							<input type="submit" value="Login" id="formbtn" />
						</form>

						<form action="" class="loginPageForm signupForm">
							<label for="firstName">First Name</label>
							<input type="text" id="firstName" required />
							<label for="lasttName">Last Name</label>
							<input type="text" id="lasttName" required />
							<label for="email">email address</label>
							<input type="text" id="email" required />
							<label for="signupPassword">Password</label>
							<input type="password" id="signupPassword" required />
							<input type="submit" value="SignUp" id="formbtn" />
						</form>
					</div>
				</article>
			</div>
		</section>
	</body>
</html>
